[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graphambicardio"
version = "0.1.0"
description = "Knowledge graph of environmental exposures, molecular mechanisms, cardiogenesis and congenital heart defects"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "GraphAmbiCardio study team" }]
dependencies = [
  "requests>=2.31",
  "pandas>=2.0",
  "numpy>=1.26",
  "networkx>=3.2",
  "scipy>=1.11",
  "statsmodels>=0.14",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
datasus = ["pysus>=2.0", "dbfread>=2.0", "pyreaddbc>=2.0"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
